<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPRCAS Login</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#1e3c72,#2a5298);
    }

    .login-container{
        background:#fff;
        padding:40px;
        border-radius:15px;
        width:350px;
        text-align:center;
        box-shadow:0 5px 20px rgba(0,0,0,0.2);
    }

    .logo{
        width:120px;
        height:auto;
        margin-bottom:15px;
    }

    h2{
        color:#2a5298;
        margin-bottom:25px;
    }

    .input-box{
        width:100%;
        padding:12px;
        margin:10px 0;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
    }

    .login-btn{
        width:100%;
        padding:12px;
        margin-top:15px;
        background:#2a5298;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
    }

    .login-btn:hover{
        background:#1e3c72;
    }
</style>
</head>

<body>

<div class="login-container">

    <!-- College Logo -->
    <img src="logo1.jpg" alt="KPRCAS Logo" class="logo">

    <h2>Student Login</h2>

    <form>
        <input type="text" placeholder="Username" class="input-box" required>
        <input type="password" placeholder="Password" class="input-box" required>

        <button type="submit" class="login-btn">Login</button>
    </form>

</div>

</body>
</html>
